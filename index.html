<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Forkify</title>
</head>

<body class="body">
    <div class="container mt-5">
        <header class="header p-3">
            <div class="w-75 d-flex justify-content-between">
                <span class="logo">Forkify</span>
                <form class="input-button d-flex justify-content-between text-center" id="input-button">
                    <input type="text" class="input w-75 m-2 p-2" placeholder="Search over 1,000,000 recipes...">
                    <button type="submit" class="btn w-25"><i class="bi bi-search"></i> SEARCH</button>
                </form>
            </div>
        </header>
        <div class="wrapper">
            <div class="result w-25">
                <ul class="result_list"></ul>
            </div>
            <div class="recipe w-50"></div>
            <div class="shopping w-25 text-center">
                <h5 class="shopping_header mt-4">MY SHOPPING LIST</h5>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html
